services:
  - type: web
    name: consultoria-digital
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /casos/*
        destination: /index.html
    envVars:
      - key: VITE_COMPANY_NAME
        sync: false
      - key: VITE_CONTACT_EMAIL
        sync: false
